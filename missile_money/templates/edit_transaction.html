{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Edit Transaction</h1>
    
    <form method="post" class="card p-4 mt-4">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="type" class="form-label">Type:</label>
            <select name="type" id="type" class="form-select" required onchange="updateCategories()">
                <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option>
                <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="category" class="form-label">Category:</label>
            <select name="category" id="category" class="form-select">
                <option value="">Select a category</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="amount" class="form-label">Amount:</label>
            <input type="number" 
                   name="amount" 
                   id="amount" 
                   step="0.01" 
                   class="form-control" 
                   value="{{ transaction.amount }}"
                   required>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <input type="text" 
                   name="description" 
                   id="description" 
                   class="form-control" 
                   value="{{ transaction.description }}">
        </div>
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
const incomeCategories = [
    ['job', 'Job'],
    ['investments', 'Investments'],
    ['reimbursements', 'Reimbursements (non-taxable)'],
    ['other_income', 'Other']
];

const expenseCategories = [
    ['groceries', 'Groceries'],
    ['utilities_housing', 'Utilities/Housing'],
    ['recreation', 'Recreation'],
    ['other_expense', 'Other']
];

const currentCategory = '{{ transaction.category|default:"" }}';

function updateCategories() {
    const typeSelect = document.getElementById('type');
    const categorySelect = document.getElementById('category');
    const selectedType = typeSelect.value;
    
    // Clear existing options
    categorySelect.innerHTML = '<option value="">Select a category</option>';
    
    // Add appropriate categories based on type
    const categories = selectedType === 'income' ? incomeCategories : expenseCategories;
    categories.forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        if (value === currentCategory) {
            option.selected = true;
        }
        categorySelect.appendChild(option);
    });
}

// Initialize categories on page load
document.addEventListener('DOMContentLoaded', function() {
    updateCategories();
});
</script>
{% endblock %}
