{% extends "base.html" %}
{% block content %}
  <h2>Split Transaction #{{ transaction.id }} — ${{ transaction.amount }}</h2>
  <p>{{ transaction.description }}</p>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Create Bill</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
