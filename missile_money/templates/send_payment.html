<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Payment</title>
</head>
<body>
    <h1>Send Payment</h1>
    <form method="post">
        {% csrf_token %}
        <label for="recipient">Recipient Username:</label>
        <input type="text" id="recipient" name="recipient" required><br><br>

        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0" required><br><br>

        <label for="description">Description (optional):</label><br>
        <textarea id="description" name="description" rows="3" cols="40"></textarea><br><br>

        <button type="submit">Send Payment</button>
    </form>
</body>
</html>
