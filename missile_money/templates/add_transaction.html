{% extends 'base.html' %}

{% block title %}Add Transaction{% endblock %}

{% block content %}
<div class="card">
    <h1>Add Transaction</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="type">Type:</label>
            <select name="type" id="type" class="form-control" required onchange="updateCategories()">
                <option value="">Select a type</option>
                <option value="income" {% if form.type.value == 'income' %}selected{% endif %}>Income</option>
                <option value="expense" {% if form.type.value == 'expense' %}selected{% endif %}>Expense</option>
            </select>
        </div>
        <div class="form-group">
            <label for="category">Category:</label>
            <select name="category" id="category" class="form-control">
                <option value="">Select a category</option>
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Amount:</label>
            {{ form.amount }}
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            {{ form.description }}
        </div>
        <div class="form-group">
            <label>
              <input type="checkbox" id="peerPayment" name="peer_payment"
                     onclick="toggleRecipient()">
              Peer‑to‑peer payment
            </label>
          </div>
          <div class="form-group" id="recipient-div" style="display:none;">
            <label for="recipient">Recipient:</label>
            {{ form.recipient }}
          </div>
        <button type="submit" class="btn">Add Transaction</button>
    </form>
</div>

<script>
const incomeCategories = [
    ['job', 'Job'],
    ['investments', 'Investments'],
    ['reimbursements', 'Reimbursements (non-taxable)'],
    ['other_income', 'Other']
];

const expenseCategories = [
    ['groceries', 'Groceries'],
    ['utilities_housing', 'Utilities/Housing'],
    ['recreation', 'Recreation'],
    ['peer-payment', 'Peer Payment'],
    ['other_expense', 'Other']
];

function toggleRecipient() {
  const peerCheckbox = document.getElementById('peerPayment');
  const recipientDiv = document.getElementById('recipient-div');
  recipientDiv.style.display = peerCheckbox.checked ? 'block' : 'none';
}
document.addEventListener('DOMContentLoaded', toggleRecipient);

function updateCategories() {
    const typeSelect = document.getElementById('type');
    const categorySelect = document.getElementById('category');
    const selectedType = typeSelect.value;
    
    // Clear existing options
    categorySelect.innerHTML = '<option value="">Select a category</option>';
    
    // Only populate if a type is selected
    if (selectedType) {
        // Add appropriate categories based on type
        const categories = selectedType === 'income' ? incomeCategories : expenseCategories;
        categories.forEach(([value, label]) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            categorySelect.appendChild(option);
        });
    }
}

// Initialize categories based on initial type value
document.addEventListener('DOMContentLoaded', function() {
    updateCategories();
    const typeSelect = document.getElementById('type');
    typeSelect.addEventListener('change', updateCategories);
});
</script>
{% endblock %}
